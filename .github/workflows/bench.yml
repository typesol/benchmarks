name: bench

# run.ts on every push and pull request; the official examples (slow to build) on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      official:
        description: "Also build and run the official examples"
        type: boolean
        default: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Agave CLI, platform-tools and cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
            ~/.cargo/registry
            target
            vendor/typesol/test/anchor-twins/target
            vendor/typesol/bench/anchor/target
          key: bench-agave-3.1.10-${{ hashFiles('package-lock.json', 'Cargo.lock') }}
      - name: Install Agave CLI and platform-tools
        run: |
          [ -x ~/.local/share/solana/install/active_release/bin/solana ] || sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          for i in 1 2 3 4; do cargo-build-sbf --install-only --tools-version v1.52 && break; sleep $((i * 15)); done
      - run: npm ci --no-audit --no-fund
      - run: bash scripts/setup.sh
      - name: The released compiler's results are archived
        run: node scripts/archive.ts --check
      - name: Keep the committed results as the baseline
        run: cp results.json "$RUNNER_TEMP/baseline.json"
      - run: node run.ts
      - name: Official examples
        if: ${{ inputs.official }}
        run: bash official/build.sh && node official.ts
      # Fails when any number differs from the committed results.json; the differences are in the job summary.
      - name: Compare with results.json
        run: node scripts/compare.ts "$RUNNER_TEMP/baseline.json" results.json ${{ inputs.official && '--official' || '' }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: results
          path: results.json
